services:
  web:
    image: ghcr.io/sebjana/family-receipt-tracking:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "6767:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DATA_UPLOAD_MAX_NUMBER_FIELDS: ${DJANGO_DATA_UPLOAD_MAX_NUMBER_FIELDS:-none}
      TZ: ${TZ:-Europe/Berlin}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/app.sqlite3}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    volumes:
      - receipt_data:/app/data

volumes:
  receipt_data:
